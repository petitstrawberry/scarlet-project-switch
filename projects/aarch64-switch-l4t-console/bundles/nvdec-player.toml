# Switch uses the Tegra210 stateless H.264 backend.
[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/Scarlet", rev = "9f23bd61cc63b9f59df7cf9773a4dd28ac55bf10" }
subdir = "user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["h264-stateless-hw", "mp4-aac"]
replace = true
to = "/bin/video-player"
