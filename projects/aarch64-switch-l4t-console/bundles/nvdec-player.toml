# Switch uses the Tegra210 stateless H.264 backend.
[[layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/Scarlet", rev = "72e68549b679f5ff471b79847675bbb5ec3dc73a" }
subdir = "user/video_player"
package = "video_player"
bin = "video-player"
default-features = false
features = ["h264-stateless-hw", "mp4-aac"]
replace = true
to = "/bin/video-player"
