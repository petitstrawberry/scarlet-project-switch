[package]
name = "bluetooth-qa-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bluetooth-qa-kernel"
path = "main.rs"

[dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "3729abeb01f0b1657d1eb1bee831f3aff4b71110", default-features = false, features = ["linux-boot", "network", "user-fpu", "user-vector"] }
scarlet-driver-joycon-bt = { path = "../../../drivers/input/joycon-bt" }
