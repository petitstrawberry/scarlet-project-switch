[package]
name = "bluetooth-qa-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bluetooth-qa-kernel"
path = "main.rs"

[dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "79fc62e1c9736b85dd27e49513a8585fe98387cc", default-features = false, features = ["linux-boot", "network", "user-fpu", "user-vector"] }
scarlet-driver-joycon-bt = { path = "../../../drivers/input/joycon-bt" }
