[package]
name = "bluetooth-qa-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bluetooth-qa-kernel"
path = "main.rs"

[dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8105761c2571c4d7e36843d87c4ebc904f35205f", default-features = false, features = ["linux-boot", "network", "user-fpu", "user-vector"] }
scarlet-driver-joycon-bt = { path = "../../../drivers/input/joycon-bt" }
