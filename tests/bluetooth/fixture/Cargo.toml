[package]
name = "bluetooth-qa-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bluetooth-qa-kernel"
path = "main.rs"

[dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7dd651c6eeeb50c46a76163f9e5cbb1f342db2db", default-features = false, features = ["linux-boot", "network", "user-fpu", "user-vector"] }
scarlet-driver-joycon-bt = { path = "../../../drivers/input/joycon-bt" }
