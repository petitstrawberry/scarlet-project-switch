schema_version = 2

[project]
name = "switch-boot-probe-test"

[bsp]
path = "bsp"
package = "scarlet"

[bsp.kernel]
source = { git = "https://github.com/petitstrawberry/Scarlet", rev = "30b47a71ece77b811722d5f7cf53727857f0c536" }
features = { linux-boot = true, limine = false, hypervisor = false, network = true, user-fpu = true, user-vector = true }

[modules]

[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs.cpio"

[[images.initramfs.layers]]
kind = "cargo"
source = { git = "https://github.com/petitstrawberry/Scarlet", rev = "30b47a71ece77b811722d5f7cf53727857f0c536" }
subdir = "user/scarlet-ld"
package = "scarlet-ld"
bin = "scarlet-ld"
to = "/bin/scarlet-ld"

[[images.initramfs.layers]]
kind = "cargo"
source = "../../userspace/switch-init"
package = "switch-init"
bin = "switch-init"
to = "/init"

[hooks.post-image]
command = "package.py"
