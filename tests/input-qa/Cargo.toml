[package]
name = "input-qa"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8105761c2571c4d7e36843d87c4ebc904f35205f", default-features = false, features = ["std"] }
sws-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8105761c2571c4d7e36843d87c4ebc904f35205f", default-features = false, features = ["std"] }
sws-protocol = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8105761c2571c4d7e36843d87c4ebc904f35205f", default-features = false, features = ["std"] }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "879bedaaf34a10fe156f93449406396092da55f9", features = ["platform-sws"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "879bedaaf34a10fe156f93449406396092da55f9" }

[profile.release]
panic = "abort"
