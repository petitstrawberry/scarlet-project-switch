[package]
name = "gm20b-depth-qa"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[dependencies]
sgfx-codegen-maxwell = { path = "../../userspace/sgfx-codegen-maxwell" }
maxwell-submit-wire = { path = "../../shared/maxwell-submit-wire" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "040dbb5cf42b75489504e1765183d37f6131f54c", default-features = false }

[target.'cfg(target_os = "scarlet")'.dependencies]
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064", default-features = false, features = ["std"] }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064", default-features = false, features = ["std"] }
