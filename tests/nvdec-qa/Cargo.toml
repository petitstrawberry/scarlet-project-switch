[package]
name = "nvdec-qa"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-video-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "79fc62e1c9736b85dd27e49513a8585fe98387cc", default-features = false, features = ["std", "h264-stateless-hw"] }

[dev-dependencies]
scarlet-codecs = { git = "https://github.com/petitstrawberry/Scarlet", rev = "79fc62e1c9736b85dd27e49513a8585fe98387cc", features = ["h264"] }
