[package]
name = "joycond"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[[bin]]
name = "joycond"
path = "src/main.rs"

[dependencies]
scarlet-switch-joycon-abi = { path = "../joycon-abi" }
scarlet-abi = { git = "https://github.com/petitstrawberry/Scarlet", rev = "79fc62e1c9736b85dd27e49513a8585fe98387cc" }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "79fc62e1c9736b85dd27e49513a8585fe98387cc", default-features = false, features = ["std"] }
