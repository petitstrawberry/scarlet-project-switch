[package]
name = "joycond"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[[bin]]
name = "joycond"
path = "src/main.rs"

[dependencies]
scarlet-switch-joycon-abi = { path = "../joycon-abi" }
scarlet-abi = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8a8ea87ed101fafdb06723382f95ceb3b3d829a6" }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8a8ea87ed101fafdb06723382f95ceb3b3d829a6", default-features = false, features = ["std"] }
