[package]
name = "joycond"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[[bin]]
name = "joycond"
path = "src/main.rs"

[dependencies]
scarlet-switch-joycon-abi = { path = "../joycon-abi" }
scarlet-abi = { git = "https://github.com/petitstrawberry/Scarlet", rev = "82b38f7026328a2b839c90004ce2de7655caa6ba" }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "82b38f7026328a2b839c90004ce2de7655caa6ba", default-features = false, features = ["std"] }
