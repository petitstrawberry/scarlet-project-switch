[package]
name = "joycond"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[[bin]]
name = "joycond"
path = "src/main.rs"

[dependencies]
scarlet-switch-joycon-abi = { path = "../joycon-abi" }
scarlet-abi = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7dd651c6eeeb50c46a76163f9e5cbb1f342db2db" }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7dd651c6eeeb50c46a76163f9e5cbb1f342db2db", default-features = false, features = ["std"] }
