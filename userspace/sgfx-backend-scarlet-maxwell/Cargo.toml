[package]
name = "sgfx-backend-scarlet-maxwell"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[features]
default = ["scarlet-std"]
std = ["dep:scarlet-os", "gpu-raw/std"]
scarlet-std = ["dep:scarlet-std", "gpu-raw/scarlet-std"]

[dependencies]
maxwell-submit-wire = { path = "../../shared/maxwell-submit-wire" }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8340078937951f6096e6f3273b547665368f70f4", package = "gpu-raw", default-features = false }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8340078937951f6096e6f3273b547665368f70f4", package = "scarlet-os", default-features = false, features = ["std"], optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8340078937951f6096e6f3273b547665368f70f4", package = "scarlet-std", optional = true }
sgfx-codegen-maxwell = { path = "../sgfx-codegen-maxwell" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "a18b5a585616f05cf5df0fa5be1977752ceca1ea", default-features = false }

[lib]
name = "sgfx_backend_scarlet_maxwell"
path = "src/lib.rs"
