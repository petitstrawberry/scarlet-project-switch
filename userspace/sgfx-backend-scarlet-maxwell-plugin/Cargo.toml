[package]
name = "sgfx-backend-scarlet-maxwell-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[lib]
name = "sgfx_scarlet_maxwell"
crate-type = ["cdylib"]

[dependencies]
sgfx-backend-abi = { git = "https://github.com/petitstrawberry/sgfx", rev = "73330c2c6edc59f0b3a0081b96a5ad379086cbc5" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false, features = ["backend-abi"] }

[target.'cfg(any(target_os = "scarlet", all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
sgfx-backend-scarlet-maxwell = { path = "../sgfx-backend-scarlet-maxwell", default-features = false, features = ["std"] }
sgfx-codegen-maxwell = { path = "../sgfx-codegen-maxwell" }
maxwell-submit-wire = { path = "../../shared/maxwell-submit-wire" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

[dev-dependencies]
# Exercise the metadata producer used by native applications, independently
# of the plugin's core pin. A plugin must accept this facade's snapshots.
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "73330c2c6edc59f0b3a0081b96a5ad379086cbc5", default-features = false }
