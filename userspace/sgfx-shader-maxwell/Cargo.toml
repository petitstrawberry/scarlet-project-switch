[package]
name = "sgfx-shader-maxwell"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "3a6a987aaa5284056d4b1dcb0cd45326d30b3fe1", default-features = false }
sgfx-codegen-virgl = { git = "https://github.com/petitstrawberry/sgfx", rev = "61e5ddd0f0e31309d2468ace3c4afe67d949fa72", default-features = false, features = ["programmable"] }
sgfx-nak = { path = "../../shared/sgfx-nak" }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }
maxwell-program-wire = { path = "../../shared/maxwell-program-wire" }
