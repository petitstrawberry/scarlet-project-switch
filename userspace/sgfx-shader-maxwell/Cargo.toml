[package]
name = "sgfx-shader-maxwell"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false }
sgfx-codegen-virgl = { git = "https://github.com/petitstrawberry/sgfx", rev = "73330c2c6edc59f0b3a0081b96a5ad379086cbc5", default-features = false, features = ["programmable"] }
sgfx-nak = { path = "../../shared/sgfx-nak" }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }
maxwell-program-wire = { path = "../../shared/maxwell-program-wire" }
