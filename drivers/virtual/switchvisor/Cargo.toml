[workspace]

[package]
name = "scarlet-switchvisor"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Switchvisor control device for Scarlet guests"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5a276e98759f8973bb42ea832b0d93dc0b8d7f46", default-features = false, features = ["network"] }
