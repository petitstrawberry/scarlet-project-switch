[workspace]

[package]
name = "scarlet-switchvisor"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Switchvisor control device for Scarlet guests"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7dd651c6eeeb50c46a76163f9e5cbb1f342db2db", default-features = false, features = ["network"] }
