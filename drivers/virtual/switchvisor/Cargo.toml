[workspace]

[package]
name = "scarlet-switchvisor"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Switchvisor control device for Scarlet guests"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "82b38f7026328a2b839c90004ce2de7655caa6ba", default-features = false, features = ["network"] }
