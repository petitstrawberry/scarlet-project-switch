[workspace]

[package]
name = "scarlet-switchvisor"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Switchvisor control device for Scarlet guests"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
scarlet = { git = "https://github.com/petitstrawberry/Scarlet", rev = "4453b096b4f244dce85d556c5e1514aca0cdefd3", default-features = false, features = ["network"] }
